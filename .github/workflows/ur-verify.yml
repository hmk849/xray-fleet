name: UR proxy exit check

# Checks each hosted URnetwork proxy (URLs in secret UR_PROXIES, one per
# line) by fetching ipinfo through it. Prints only the exit IP, country,
# city, org and a clean/hosting verdict - never the proxy URL itself.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check exits
        env:
          UR_PROXIES: ${{ secrets.UR_PROXIES }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          hosting = ("hosting", "host", "vpn", "datacenter", "data center", "colocation",
                     "colo", "cloud", "amazon", "digitalocean", "ovh", "hetzner",
                     "linode", "vultr", "contabo", "m247", "choopa", "leaseweb",
                     "3xk", "serverius", "psychz", "hostkey", "aeza",
                     "godaddy", "namecheap", "ionos", "akamai", "cloudflare",
                     "fastly", "quadranet", "bluehost", "hostgator", "hostinger")
          urls = [l.strip() for l in os.environ["UR_PROXIES"].splitlines() if l.strip()]
          n_clean = n_host = n_dead = 0
          for i, url in enumerate(urls, 1):
              d = None
              diag = ""
              for attempt in (1, 2):
                  try:
                      r = subprocess.run(
                          ["curl", "-s", "-m", "60", "-w", "\n%{http_code}",
                           "--proxy", url, "https://ipinfo.io/json"],
                          capture_output=True, text=True, timeout=75)
                      body = r.stdout.rsplit("\n", 1)[0]
                      diag = f"curl rc={r.returncode} http={r.stdout.rsplit(chr(10), 1)[-1]} body={body[:120]!r}"
                      d = json.loads(body)
                      if d.get("ip"):
                          break
                      d = None
                  except Exception as e:
                      diag = f"exc {type(e).__name__}: {str(e)[:120]}"
                      d = None
                  if attempt == 1:
                      time.sleep(5)
              if d is None:
                  n_dead += 1
                  print(f"[{i}] DEAD ({diag})")
                  continue
              ip, cc, city, org = d.get("ip"), d.get("country"), d.get("city"), d.get("org")
              verdict = "HOSTING" if org and any(w in org.lower() for w in hosting) else "clean"
              if verdict == "clean":
                  n_clean += 1
              else:
                  n_host += 1
              print(f"[{i}] {ip} {cc} {city} {org} -> {verdict}")
              time.sleep(2)
          print(f"TOTAL {len(urls)} | clean {n_clean} | hosting {n_host} | dead {n_dead}")
          PY
